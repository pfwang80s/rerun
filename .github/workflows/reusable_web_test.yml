name: Reusable Web tests

on:
  workflow_call:
    inputs:
      CONCURRENCY:
        required: true
        type: string
      REF:
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ inputs.CONCURRENCY }}-web-test
  cancel-in-progress: true

env:
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: "read"
  id-token: "write"

jobs:
  web-test:
    name: Browser tests
    timeout-minutes: 60
    runs-on: ubuntu-latest-16-cores
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.REF || (github.event_name == 'pull_request' && github.event.pull_request.head.ref) || '' }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache_key: "web-test"
          save_cache: false
          targets: wasm32-unknown-unknown
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.71.3

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Set up geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Run Wasm browser tests
        run: pixi run web-test

  chrome-mcap-range-test:
    name: Chrome MCAP Range fixture
    timeout-minutes: 20
    runs-on: ubuntu-latest-16-cores
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.REF || (github.event_name == 'pull_request' && github.event.pull_request.head.ref) || '' }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache_key: "web-test-chrome-mcap-range"
          save_cache: false
          targets: wasm32-unknown-unknown
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.71.3

      - name: Set up Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run Chrome MCAP Range browser tests
        run: |
          pixi run web-test --browser chrome --package re_mcap_chrome_test
          pixi run web-test --browser chrome --package re_web

      - name: Build release-Wasm MCAP Phase A proof
        run: pixi run mcap-phase-a-proof-build

      - name: Run Chrome MCAP Phase A benchmark
        run: |
          pixi run web-test --browser chrome --package re_mcap_phase_a_chrome \
            --phase-a-proof-dir target/mcap-phase-a-proof-v1 \
            --phase-a-artifact-out target/mcap-phase-a-evidence-v1.json

      - name: Upload MCAP Phase A evidence
        uses: actions/upload-artifact@v7
        with:
          name: mcap-phase-a-evidence-v1
          path: |
            target/mcap-phase-a-evidence-v1.json
            target/mcap-phase-a-proof-v1/proof-manifest-v1.json
            target/mcap-phase-a-proof-v1/re_mcap_phase_a_proof.js
            target/mcap-phase-a-proof-v1/re_mcap_phase_a_proof_bg.wasm
            target/mcap-phase-a-proof-v1/phase-a-fixture.mcap
          if-no-files-found: error
