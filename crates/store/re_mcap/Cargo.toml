[package]
name = "re_mcap"
description = "Convert MCAP into Rerun-compatible data"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
## Enables reusable MCAP fixture builders for downstream tests.
testing = ["dep:crc32fast", "dep:lz4_flex", "dep:zstd"]
## Keeps the bounded runtime-intern transaction compiled only for its disarmed proof feature.
rerun_mcap_locked_remote_wasm_allocator_v1 = [
  "dep:re_string_interner",
  "re_string_interner/bounded_runtime_intern",
]

[dependencies]
re_chunk.workspace = true
re_byte_size.workspace = true
re_int.workspace = true
re_log_types.workspace = true
re_log.workspace = true
re_quota_channel.workspace = true
re_tuid.workspace = true
re_ros_msg.workspace = true
re_sdk_types = { workspace = true, features = ["ecolor", "glam", "image", "video"] }
re_string_interner = { workspace = true, optional = true }
re_tracing.workspace = true

ahash.workspace = true
anyhow.workspace = true
arrow.workspace = true
blake3.workspace = true
byteorder.workspace = true
crossbeam.workspace = true
crc32fast = { version = "1.5.0", optional = true }
itertools.workspace = true
lz4_flex = { workspace = true, optional = true }
mcap.workspace = true
parking_lot.workspace = true
prost-reflect.workspace = true
rayon.workspace = true
re_cdr.workspace = true
regex-lite.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
zstd = { version = "0.13.3", optional = true, features = ["experimental"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
crc32fast = "1.5.0"
lz4_flex.workspace = true
re_chunk_store.workspace = true
re_mcap_web_contract.workspace = true
xxhash-rust.workspace = true
zstd = { version = "0.13.3", features = ["experimental", "wasm"] }

[dev-dependencies]
crc32fast = "1.5.0"
insta = { workspace = true, features = ["filters", "redactions"] }
lz4_flex.workspace = true
prost-reflect = { workspace = true, features = ["text-format"] }
re_arrow_util.workspace = true
re_chunk_store = { workspace = true, features = ["remote_mcap_test"] }
re_entity_db = { workspace = true, features = ["remote_mcap_test"] }
re_log = { workspace = true, features = ["setup"] }
re_mcap_web_contract.workspace = true
re_string_interner = { workspace = true, features = ["bounded_runtime_intern"] }
static_assertions.workspace = true
xxhash-rust.workspace = true
zstd = { version = "0.13.3", features = ["experimental"] }

[build-dependencies]
re_build_tools.workspace = true
