[package]
name = "re_mcap_phase_a_chrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[package.metadata.rerun.web-test]
mcap-range-server = true
browsers = ["chrome"]
phase-a-benchmark = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
parking_lot.workspace = true
re_mcap = { workspace = true, features = ["testing"] }
re_memory.workspace = true
re_web.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
re_web_tests = { path = "../../../crates/build/re_web_tests" }
wasm-bindgen-futures.workspace = true
wasm-bindgen-test.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
parking_lot.workspace = true
web-time.workspace = true

[build-dependencies]
re_build_tools.workspace = true
